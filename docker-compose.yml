version: '3.8'

services:
  # ── Banco de dados ───────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: orcamento_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-erp_crm}
      MYSQL_USER:          ${MYSQL_USER:-erp_user}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-erp_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node/Express/Prisma) ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: orcamento_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL:      "mysql://${MYSQL_USER:-erp_user}:${MYSQL_PASSWORD:-erp_pass}@mysql:3306/${MYSQL_DATABASE:-erp_crm}"
      JWT_SECRET:        "${JWT_SECRET:-super_secret_32_chars_min}"
      ADMIN_EMAIL:       "${ADMIN_EMAIL:-admin@admin.com}"
      ADMIN_PASSWORD:    "${ADMIN_PASSWORD:-admin}"
      ADMIN_NAME:        "${ADMIN_NAME:-Administrador}"
      FRONTEND_URL:      "${FRONTEND_URL:-http://localhost:3000}"
      NODE_ENV:          production
      PORT:              3002
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
    container_name: orcamento_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
    networks:
      - app-network

  # ── Nginx (proxy reverso) ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: orcamento_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
